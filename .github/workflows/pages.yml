name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,8,11,14,17,20 * * *'  # 6x taeglich, ca. 07-22 Uhr Berlin (Sommerzeit; Winter jeweils 1h frueher)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: |
          cat payload-*.b64 | base64 -d | tar xz --skip-old-files
          ls -R site | head -30
      - name: Fetch data and build
        working-directory: site
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          STOCK_QUOTES_ENABLED: "1"  # Owner requested API publication on 2026-10-19; see site/STOCKS.md
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}  # leer = Key-Datei und Push werden uebersprungen
        run: |
          python3 data.py
          python3 build.py
          touch ../data/.keep
      - name: Author page (Philipp Paulik)
        run: python3 authorpage/authorpage.py fa site/out --assets authorpage/assets
      - name: Persist archives
        run: |
          git config user.name "site-bot"; git config user.email "bot@users.noreply.github.com"
          git add data report-archive || true
          git commit -m "Update data archive" || true
          git push || true
      - name: IndexNow-URL-Liste als Artefakt bereitstellen
        if: hashFiles('site/out/indexnow-urls.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: site/out/indexnow-urls.txt
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      # IndexNow erst NACH erfolgreichem Deployment: Key-Datei oeffentlich pruefen,
      # nur neue/geaenderte Artikel-URLs melden, Status erst bei HTTP 200 committen.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: IndexNow push (Bing, Yandex, Naver, Seznam - nicht Google)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then echo "INDEXNOW_KEY nicht gesetzt, uebersprungen"; exit 0; fi
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          key = os.environ['INDEXNOW_KEY'].strip()
          urls = [u.strip() for u in open('indexnow-urls.txt') if u.strip()]
          if not urls:
              print('keine neuen URLs'); raise SystemExit(0)
          key_url = 'https://finanz-adjust.de/%s.txt' % key
          ok = False
          for attempt in range(6):
              try:
                  body = urllib.request.urlopen(key_url, timeout=15).read().decode().strip()
                  if body == key:
                      ok = True; break
              except Exception as e:
                  print('Key-Check Versuch', attempt + 1, e)
              time.sleep(20)
          if not ok:
              print('Key-Datei noch nicht oeffentlich verifizierbar, Push beim naechsten Lauf'); raise SystemExit(0)
          payload = json.dumps({"host": "finanz-adjust.de", "key": key,
                                "keyLocation": key_url, "urlList": urls}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=payload,
                                       headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print('IndexNow HTTP', r.status, '- gemeldet:', len(urls))
          except urllib.error.HTTPError as e:
              print('IndexNow HTTP-Fehler', e.code, '- Statusdatei bleibt, Retry beim naechsten Build'); raise SystemExit(0)
          if r.status != 200:
              raise SystemExit(0)
          # Erfolg: gemeldete Artikel in der Statusdatei vermerken (slug -> modified)
          import subprocess, glob
          state = {}
          if os.path.exists('data/indexnow-state.json'):
              state = json.load(open('data/indexnow-state.json'))
          import datetime as _dt
          def _mdate(a):
              # spiegelt site/build.py mdate(): 'modified' gewinnt, sonst 'date'
              try:
                  return _dt.datetime.fromisoformat(a['modified']).isoformat()
              except Exception:
                  try:
                      d = _dt.datetime.fromisoformat(a['date'])
                      if d.tzinfo is None:
                          d = d.astimezone()
                      return d.isoformat()
                  except Exception:
                      return ''
          arts = {}
          for f in glob.glob('content/articles/*.json'):
              try:
                  a = json.load(open(f))
                  if a.get('slug'):
                      arts['https://finanz-adjust.de/artikel/%s/' % a['slug']] = _mdate(a)
              except Exception:
                  pass
          for u in urls:
              if u in arts:
                  state[u.rstrip('/').rsplit('/', 1)[-1]] = arts[u]
          json.dump(state, open('data/indexnow-state.json', 'w'), ensure_ascii=False, indent=1, sort_keys=True)
          subprocess.run(['git', 'config', 'user.name', 'site-bot'])
          subprocess.run(['git', 'config', 'user.email', 'bot@users.noreply.github.com'])
          subprocess.run(['git', 'add', 'data/indexnow-state.json'])
          subprocess.run(['git', 'commit', '-m', 'IndexNow: gemeldete URLs vermerkt'])
          # parallele Bot-/Feature-Commits nicht ueberschreiben: rebase vor push, sonst Retry naechster Lauf
          subprocess.run(['git', 'fetch', 'origin', 'main'])
          rb = subprocess.run(['git', 'rebase', 'origin/main'])
          if rb.returncode == 0:
              subprocess.run(['git', 'push'])
          print('Statusdatei aktualisiert')
          PY
